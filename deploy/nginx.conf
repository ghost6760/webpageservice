# nginx de hachi.live
#
# Sirve la landing, sus páginas y los ficheros de la raíz (robots.txt,
# sitemap.xml, llms.txt, la clave de IndexNow, /.well-known/…). NO sirve la
# documentación ni las herramientas del repositorio: docs/pseo-paginas-por-sector.md §10.
#
# Se usa de dos formas (las dos valen, la del Dockerfile es la completa):
#   · Dockerfile → se copia a /etc/nginx/conf.d/default.conf.
#   · Coolify con Nixpacks → pegar este bloque en «Custom Nginx Configuration».

server {
    # Solo IPv4: el proxy de Coolify entra por la red de Docker en IPv4, y un
    # «listen [::]:80» impide arrancar nginx donde no hay IPv6.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Detrás del proxy de Coolify: las redirecciones que hace nginx por su cuenta
    # (/es → /es/) tienen que ser relativas. Con absolutas mandaría al visitante
    # a http://host:80/es/.
    absolute_redirect off;

    # llms.txt, robots.txt y los .md/.txt llevan tildes: que se lean en UTF-8.
    charset utf-8;
    charset_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # ── Lo que no se publica ───────────────────────────────────────────
    # Documentación, herramientas y configuración del despliegue.
    location ^~ /docs   { return 404; }
    location ^~ /tools  { return 404; }
    location ^~ /deploy { return 404; }
    # Ficheros ocultos (.git, .dockerignore…), salvo /.well-known/, que existe
    # precisamente para leerse (security.txt, verificaciones de dominio).
    location ~ /\.(?!well-known/) { return 404; }
    # Ningún .md es una página del sitio.
    location ~* \.md$ { return 404; }

    # ── El sitio ───────────────────────────────────────────────────────
    # $uri/ sirve los índices de carpeta (/es/, /industries/, /es/sectores/).
    # $uri.html mantiene /faq → faq.html por si algún enlace externo lo usa.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
